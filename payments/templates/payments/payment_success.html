{% extends "base.html" %}
{% block title %}پرداخت موفق{% endblock %}

{% block content %}
<div style="text-align:center;margin-top:40px">
    <h1 style="color:green">✅ پرداخت با موفقیت انجام شد</h1>

    <p>شماره سفارش: <strong>{{ order.id }}</strong></p>
    <p>مبلغ پرداختی: <strong>{{ payment.amount }} تومان</strong></p>
    <p>کد پیگیری: <strong>{{ payment.ref_id }}</strong></p>

    <br>

    <a href="/" style="padding:10px;background:#28a745;color:#fff;text-decoration:none">
        بازگشت به صفحه اصلی
    </a>
</div>
{% endblock %}
