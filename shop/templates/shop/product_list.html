{% extends 'shop/base.html' %}
{% block title %}همه محصولات{% endblock %}

{% block content %}
<h1 class="mb-4">همه محصولات</h1>

<div class="row">
  {% for product in products %}
  <div class="col-6 col-md-4 col-lg-3 mb-4">
    <div class="card h-100">
      <img src="{{ product.image.url }}" class="card-img-top">
      <div class="card-body d-flex flex-column">
        <h6>{{ product.name }}</h6>
        <p class="small text-muted">{{ product.short_description }}</p>
        <p class="fw-bold">{{ product.price }} تومان</p>
        <a href="{% url 'shop:product_detail' product.slug %}" class="btn btn-outline-primary btn-sm">
          جزئیات
        </a>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
